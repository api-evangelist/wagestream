aid: wagestream
name: Wagestream
description: >-
  Wagestream — trading as Stream since its 2025 rebrand — is a UK-founded, B Corp certified workplace
  financial wellbeing platform that gives hourly and salaried employees earned wage access (flexible pay),
  shift and pay tracking, workplace savings, budgeting tools, salary-deducted workplace loans, benefits
  and state-benefit claim support, financial coaching and discounts, delivered as a mobile app funded by
  the employer rather than the worker. Employers connect their HR, workforce management and payroll
  systems to Stream through the Wagestream Integrations API — a small, batch-oriented REST push API over
  employees, shifts (time and attendance), absences, off-cycle payments and Stream-generated enrolment
  banking records — or via SFTP file feeds and browser upload into the employer administration portal.
  The API is API-key authenticated, asynchronous (every write returns a transaction id polled through a
  matching GET), and idempotent through an optional per-request nonce.
